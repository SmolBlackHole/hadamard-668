[project]
name = "hadamard-668"
version = "0.1.0"
description = "GPU-accelerated heuristic search for Hadamard matrices"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<3",
    "numba>=0.66,<0.67",
    "pytest>=8",
    "cupy-cuda12x",
    "nvidia-cublas-cu12",
    "nvidia-cusparse-cu12",
    "nvidia-cusolver-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cufft-cu12",
    "nvidia-curand-cu12",
    "nvidia-cuda-nvcc-cu12",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "pyright>=1.1.390",
    "pytest-cov>=7.0",
    "pytest-gremlins>=1.9,<2",
    "ruff>=0.11",
    "sympy>=1.14",
]

[tool.pytest-gremlins]
paths = ["src/tracker.py", "src/solver.py"]
cache = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "C4",   # comprehensions
    "C90",  # mccabe complexity
    "SIM",  # simplify
    "B",    # bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
    "PIE",  # pie (unnecessary pass, etc.)
    "PERF", # performance
    "RET",  # return checks
]
ignore = ["E501", "E741", "C901", "PERF401", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pyright]
include = ["src", "tests", "scripts", "run.py"]
exclude = [
    ".venv",
    ".git",
    "runs",
    ".pytest-tmp",
    "**/__pycache__",
    "**/.*",
    "**/node_modules",
]
typeCheckingMode = "strict"
reportMissingModuleSource = false
reportMissingTypeStubs = false
reportMissingImports = "none"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportDuplicateImport = "error"
reportWildcardImportFromLibrary = "error"
reportPrivateUsage = "none"
reportOptionalSubscript = "error"
reportOptionalMemberAccess = "error"
reportOptionalCall = "error"
reportOptionalIterable = "error"
reportOptionalContextManager = "error"
reportOptionalOperand = "error"
reportGeneralTypeIssues = "error"
reportArgumentType = "error"
reportAttributeAccessIssue = "error"
reportCallIssue = "error"
reportIndexIssue = "error"
reportReturnType = "error"
reportRedeclaration = "error"
reportIncompatibleVariableOverride = "error"
reportIncompatibleMethodOverride = "error"
reportMissingParameterType = "warning"
reportUntypedFunctionDecorator = "none"
reportUnknownParameterType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"
reportUnknownMemberType = "warning"
