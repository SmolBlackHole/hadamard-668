[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hadamard-668"
version = "0.1.0"
description = "CPU heuristic search for negacyclic Goethals-Seidel Hadamard matrices"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SmolBlackHole" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "numba>=0.66,<0.67"]

[project.urls]
Repository = "https://github.com/SmolBlackHole/hadamard-668"
Issues = "https://github.com/SmolBlackHole/hadamard-668/issues"

[tool.setuptools]
packages = ["src", "src.solver"]
py-modules = ["run"]

[project.optional-dependencies]
dev = [
    "matplotlib>=3.10,<4",
    "latex2mathml>=3.81,<4",
    "markdown-it-py>=4.2,<5",
    "mdit-py-plugins>=0.6,<0.7",
    "pymarkdownlnt>=0.9.39,<0.10",
    "hypothesis>=6.100",
    "pyright>=1.1.390",
    "pytest>=8",
    "pytest-cov>=7.0",
    "pytest-gremlins>=1.9,<2",
    "ruff>=0.11",
    "sympy>=1.14",
]

[tool.pytest-gremlins]
paths = ["src/tracker.py", "src/solver"]
cache = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "C4",   # comprehensions
    "C90",  # mccabe complexity
    "SIM",  # simplify
    "B",    # bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
    "PIE",  # pie (unnecessary pass, etc.)
    "PERF", # performance
    "RET",  # return checks
    "D",    # pydocstyle
]
ignore = ["E501", "E741", "C901", "PERF401", "B905", "D105", "D107"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pyright]
include = ["src", "tests", "scripts", "lab", "run.py"]
exclude = [
    ".venv",
    ".venv-*",
    ".git",
    "runs",
    ".pytest-tmp",
    "**/__pycache__",
    "**/.*",
    "**/node_modules",
]
typeCheckingMode = "strict"
reportMissingModuleSource = false
reportMissingTypeStubs = false
reportMissingImports = "none"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportDuplicateImport = "error"
reportWildcardImportFromLibrary = "error"
reportPrivateUsage = "none"
reportOptionalSubscript = "error"
reportOptionalMemberAccess = "error"
reportOptionalCall = "error"
reportOptionalIterable = "error"
reportOptionalContextManager = "error"
reportOptionalOperand = "error"
reportGeneralTypeIssues = "error"
reportArgumentType = "error"
reportAttributeAccessIssue = "error"
reportCallIssue = "error"
reportIndexIssue = "error"
reportReturnType = "error"
reportRedeclaration = "error"
reportIncompatibleVariableOverride = "error"
reportIncompatibleMethodOverride = "error"
reportMissingParameterType = "warning"
reportUntypedFunctionDecorator = "none"
reportUnknownParameterType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"
reportUnknownMemberType = "warning"
